<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們的旅行回憶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* layout idea: a travel diary. Slate-blue rain palette taken from the photos, gold for headings' accents, wine for verses. Home is a stack of trips (each a row of cards); a post is a reading column with a sticky chapter list. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --ink: #1c2330;
  --muted: #586174;
  --line: #d3d8e0;
  --gold: #8a6a2f;
  --wine: #7a2e2e;
  --heart: #f6f1e4;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --latin: "Cormorant Garamond", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #1a202a; --ink: #e6e9ef; --muted: #9ea6b5; --line: #2b3340;
    --gold: #d4b36a; --wine: #e3a0a0; --heart: #231f15; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #1a202a; --ink: #e6e9ef; --muted: #9ea6b5; --line: #2b3340;
  --gold: #d4b36a; --wine: #e3a0a0; --heart: #231f15; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.95; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
img { max-width: 100%; height: auto; display: block; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
.brand { text-decoration: none; font-weight: 700; letter-spacing: .08em; font-size: 15px; display: flex; align-items: baseline; gap: 10px; }
.brand i { font-family: var(--latin); font-weight: 500; color: var(--gold); font-size: 16px; letter-spacing: .02em; }
.back { text-decoration: none; font-size: 14px; color: var(--muted); }
.back:hover { color: var(--ink); }

/* home */
.hero { padding: 56px 0 28px; max-width: 760px; }
.eyebrow { font-family: var(--latin); font-style: italic; font-weight: 500; font-size: 20px; color: var(--gold); letter-spacing: .02em; }
.hero h1 { font-size: clamp(34px, 7vw, 56px); line-height: 1.25; margin: 6px 0 16px; letter-spacing: .04em; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 18px; max-width: 34em; }
.trip { padding: 36px 0 8px; }
.vidrow { display:flex; flex-wrap:wrap; gap:18px; margin:18px 0 8px; }
.fbgrid { display:flex; flex-wrap:wrap; gap:20px; }
.vid { margin:0; width:300px; max-width:100%; }
.vid video { width:100%; background:#000; display:block; }
.vid figcaption { font-size:15px; color:var(--muted); line-height:1.7; margin-top:8px; }
.fbvid { display:flex; flex-direction:column; gap:8px; max-width:100%; }
.fblink { display:block; padding:18px 24px; border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; font-size:17px; }
.fblink:hover { border-color:var(--gold); }
.triphead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; border-top: 2px solid var(--ink); padding-top: 14px; margin-bottom: 20px; }
.triphead h2 { font-size: 26px; margin: 0; letter-spacing: .06em; }
.triphead span { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: transform .2s, border-color .2s; }
.card:hover { transform: translateY(-3px); border-color: var(--gold); }
.cardimg { aspect-ratio: 4 / 3; overflow: hidden; background: var(--line); }
.cardimg img { width: 100%; height: 100%; object-fit: cover; }
.cardtxt { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.cardtxt h3 { margin: 0; font-size: 20px; line-height: 1.5; text-wrap: balance; }
.cardtxt p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
.place { font-size: 13px; color: var(--gold); letter-spacing: .06em; }
.meta { font-size: 13px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.next { margin: 44px 0 0; padding: 22px 24px; border: 1px dashed var(--line); color: var(--muted); font-size: 15px; }
footer.site { padding: 56px 0 72px; color: var(--muted); font-size: 14px; }

/* post */
.posthead { padding: 48px 0 20px; max-width: 760px; }
.posthead h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.35; margin: 8px 0 10px; text-wrap: balance; }
.posthead .meta { padding: 0; margin: 0; }
.postgrid { display: grid; grid-template-columns: 1fr; gap: 0 56px; padding-bottom: 40px; }
.toc { font-size: 14px; line-height: 1.6; margin: 0 0 24px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); }
.toc b { display: block; color: var(--gold); margin-bottom: 8px; letter-spacing: .08em; font-weight: 600; }
.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc button { background: none; border: 0; padding: 5px 0; text-align: left; cursor: pointer; color: var(--muted); width: 100%; }
.toc button:hover { color: var(--ink); }
@media (min-width: 980px) {
  .postgrid { grid-template-columns: 230px minmax(0, 1fr); }
  .toc { position: sticky; top: 76px; align-self: start; margin: 0; border: 0; background: none; padding: 0; border-left: 2px solid var(--line); padding-left: 16px; }
}
.prose { max-width: 40em; }
.prose p { margin: 0 0 1.1em; }
.prose h2 { font-size: 26px; line-height: 1.5; margin: 2.2em 0 .7em; padding-top: 1em; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 70px; }
.prose h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.prose h3 { font-size: 20px; margin: 1.6em 0 .4em; color: var(--gold); }
.prose h4 { font-size: 17px; margin: 1.3em 0 .3em; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 0 1.2em; }
.prose li { margin-bottom: .4em; }
figure { margin: 1.8em 0; }
figure img { background: var(--line); }
figure.landscape img { width: 100%; }
figure.portrait img { max-height: 76vh; width: auto; margin: 0 auto; }
figcaption { margin-top: 8px; font-size: 14px; line-height: 1.7; color: var(--muted); text-align: center; }
.verse { margin: 1.8em 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--wine); }
.verse p { margin: 0; font-style: italic; color: var(--wine); font-size: 18px; }
.verse cite { display: block; margin-top: 6px; font-style: normal; font-size: 14px; color: var(--muted); }
.heart { margin: 1.8em 0 2.4em; padding: 16px 20px 6px; background: var(--heart); border-left: 4px solid var(--gold); }
.heart span { display: block; font-size: 13px; letter-spacing: .14em; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
.heart p { margin: 0 0 .8em; }
.quote { margin: 1.4em 0; padding: 4px 18px; border-left: 3px solid var(--line); color: var(--muted); }
.refs { margin-top: 2.4em; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.8; color: var(--muted); }
.tablewrap { overflow-x: auto; margin: 1.2em 0; }
.tablewrap table { border-collapse: collapse; font-size: 15px; }
.tablewrap td, .tablewrap th { border: 1px solid var(--line); padding: 6px 10px; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 3em; }
.pn a { display: block; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; line-height: 1.6; }
.pn a:hover { border-color: var(--gold); }
.pn a.r { text-align: right; }
.pn small { display: block; color: var(--gold); font-size: 12px; letter-spacing: .1em; }
@media (max-width: 560px) { .pn { grid-template-columns: 1fr; } body { font-size: 16.5px; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .card { transition: none; } }
.updated { font-size: 13px; color: var(--gold); letter-spacing: .05em; margin-top: 6px; }
.mapbox { margin: 40px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.mapframe { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 460px; background: var(--surface); border: 1px solid var(--line); }
.mapframe iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.mapframe.off { aspect-ratio: auto; padding: 16px; }
.mapnote { margin: 0; font-size: 14px; }
.prose .maplinks, .maplinks { list-style: none; padding: 0; margin: 14px 0 4px; display: flex; flex-wrap: wrap; gap: 8px; }
.maplinks li { margin: 0; padding: 0; }
.maplinks a { display: inline-block; padding: 9px 14px; border: 1px solid var(--gold); text-decoration: none; font-size: 15px; line-height: 1.3; }
.maplinks a::before { content: "↗ "; color: var(--gold); }
.mapsmall { font-size: 13px; color: var(--muted, #888); margin: 4px 0 0; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="#home" data-go="home">我們的旅行回憶 <i>Reisetagebuch</i></a>
  <a class="back" id="backlink" href="#home" data-go="home" hidden>← 全部文章</a>
</div></header>

<main class="wrap">
<section id="view-home">
  <div class="hero">
    <div class="eyebrow">Unsere Reise</div>
    <h1>我們的旅行回憶</h1>
    <p>我和太太一起走過的地方。每到一個景點，先查清楚它的歷史，再放上我們拍的照片、一節經文，和那一刻的感動。</p>
    <p class="updated">最後更新：__UPDATED__（奧地利時間）</p>
  </div>
{{TRIPS}}
  <p class="next">下一個地方還在路上，走到哪裡，就記到哪裡。</p>
</section>
{{ARTICLES}}
</main>
<footer class="site"><div class="wrap">照片由我們自己拍攝。歷史內容整理自網路資料，各篇文末附有參考資料。</div></footer>

<script>
(function () {
  var ids = [];
  document.querySelectorAll('article.post').forEach(function (a) { ids.push(a.id.replace('view-', '')); });
  function show() {
    var h = (location.hash || '').replace('#', '');
    if (ids.indexOf(h) < 0) h = 'home';
    document.getElementById('view-home').hidden = (h !== 'home');
    ids.forEach(function (i) { document.getElementById('view-' + i).hidden = (i !== h); });
    document.getElementById('backlink').hidden = (h === 'home');
    var t = document.querySelector('#view-' + h + ' h1');
    document.title = (h === 'home' || !t) ? '我們的旅行回憶' : t.textContent + '｜我們的旅行回憶';
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); var g = go.getAttribute('data-go'); if (location.hash === '#' + g) show(); else location.hash = g; return; }
    var sc = e.target.closest('[data-scroll]');
    if (sc) { var el = document.getElementById(sc.getAttribute('data-scroll')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
<script>
{ // 地圖：只在公開網站（GitHub Pages）嵌入 Google 地圖；預覽頁不允許嵌入就只顯示連結
  const canEmbed = /github\.io$/.test(location.hostname);
  for (const f of document.querySelectorAll('.mapframe iframe')) {
    if (canEmbed) f.src = f.dataset.src;
    else { f.remove(); const box = document.querySelectorAll('.mapframe'); }
  }
  if (!canEmbed) for (const b of document.querySelectorAll('.mapframe')) { b.classList.add('off'); b.querySelector('.mapnote').hidden = false; }
}
</script>
</body>
</html>
